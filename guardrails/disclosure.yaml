# Imbas Intake — First-Contact AI Disclosure
# Guardrails Spec item 1. See guardrails/system-prompt.md BLOCK 1.
#
# Every deployment MUST deliver one of these variants before collecting any information
# about the person's legal matter. The renderer selects by:
#   channel   : voice | chat
#   direction : inbound | callback
#   language  : en | es
#
# Copy is approved text. Do not paraphrase, shorten, or soften it in a deployment.
# Firms may prepend a firm-specific greeting; they may not alter or remove the three
# required elements.

version: "1.0.0"
spec_item: 1

# --------------------------------------------------------------------------------------
# What every variant must contain. The QA regression suite asserts all three are present
# in the first agent turn.
# --------------------------------------------------------------------------------------
required_elements:
  - id: is_ai
    description: >
      States plainly that the speaker is an AI assistant, not a human. Must be
      unambiguous — "virtual assistant" and "automated system" are NOT sufficient on
      their own because callers routinely read them as "IVR operated by a person".
    assert_contains_any_en: ["AI assistant", "AI receptionist", "artificial intelligence"]
    assert_contains_any_es: ["asistente de inteligencia artificial", "asistente de IA"]
  - id: whose_agent
    description: Names the firm the assistant works for.
    token: "{{FIRM_NAME}}"
  - id: not_an_attorney
    description: >
      States that the assistant is not an attorney and cannot give legal advice.
      This element is load-bearing for Spec items 2 and 3 and may never be dropped.
    assert_contains_any_en: ["not an attorney", "not a lawyer"]
    assert_contains_any_es: ["no soy abogad"]

timing:
  rule: first_agent_turn
  before: any_matter_question
  # If the caller speaks first and launches into their matter, let them finish the
  # sentence, then disclose before asking the first question.
  interrupt_policy: let_caller_finish_sentence_then_disclose
  repeat_on_reconnect: true
  repeat_on_channel_switch: true
  # Long chat sessions: re-disclose if the widget is reopened after this idle gap.
  chat_reopen_redisclose_after_minutes: 30

logging:
  on_delivery:
    event: disclosure_delivered
    fields: [variant_id, language, channel, direction, timestamp]
  on_omission:
    # A conversation that reaches matter questions with no disclosure_delivered event is
    # a P1 defect. The audit log marks the record non-compliant.
    event: guardrail_violation
    severity: critical

# --------------------------------------------------------------------------------------
# Recording notice. Composed into the same opening turn when telephony.recording.enabled.
# Two-party / all-party consent states require an affirmative yes BEFORE recording starts.
# --------------------------------------------------------------------------------------
recording_notice:
  # VERIFY: the set of all-party-consent states and the exact consent mechanics vary by
  # jurisdiction and are unsettled for AI-assisted calls. The founder's attorney must
  # confirm the list for every state in firm.jurisdictions before go-live. Until then,
  # deployments default to consent_mode: all_party_affirmative, which is safe everywhere.
  default_consent_mode: all_party_affirmative
  consent_modes:
    all_party_affirmative:
      description: Ask, and wait for a yes, before recording begins.
      en: >-
        This call is recorded so the firm has an accurate record — is that okay with you?
      es: >-
        Esta llamada se graba para que la oficina tenga un registro exacto. ¿Está bien?
      on_decline:
        action: continue_without_recording
        log: { field: recording_consent, value: declined }
        en: >-
          No problem at all — I've turned the recording off. I'll still take notes so the
          attorney has your information.
        es: >-
          Sin problema, ya desactivé la grabación. De todos modos voy a tomar notas para
          que el abogado tenga su información.
    one_party_notice:
      description: Notify only. Use only where counsel has confirmed it is sufficient.
      en: "Just so you know, this call is recorded."
      es: "Le aviso que esta llamada se graba."
    none:
      description: No audio recording; transcript only. Notice still required.
      en: "This conversation is written down so the firm has your information accurately."
      es: >-
        Esta conversación queda por escrito para que la oficina tenga su información con
        exactitud.

# --------------------------------------------------------------------------------------
# Variants
# --------------------------------------------------------------------------------------
variants:

  # ---------------- VOICE · INBOUND · ENGLISH ----------------
  - id: voice.inbound.en
    channel: voice
    direction: inbound
    language: en
    script: >-
      Thanks for calling {{FIRM_NAME}}. I'm {{AGENT_NAME}}, the firm's AI assistant —
      so I'm not a person, and I'm not an attorney, which means I can't give legal
      advice. What I can do is get your information down and get you in front of an
      attorney. {{RECORDING_NOTICE}} Can you tell me what's going on?
    notes: >
      Keep it to one breath. The recording notice, when present, is a separate short
      sentence — never a subordinate clause buried inside the disclosure.

  # ---------------- VOICE · INBOUND · SPANISH ----------------
  - id: voice.inbound.es
    channel: voice
    direction: inbound
    language: es
    script: >-
      Gracias por llamar a {{FIRM_NAME}}. Soy {{AGENT_NAME}}, el asistente de
      inteligencia artificial de la oficina — no soy una persona y no soy abogado, así
      que no le puedo dar asesoría legal. Lo que sí puedo hacer es tomar su información y
      conectarlo con un abogado. {{RECORDING_NOTICE}} ¿Me cuenta qué pasó?
    notes: >
      "asesoría legal" is the term used across US Spanish-language legal marketing.
      Use usted throughout; never tutear a caller you have not met.

  # ---------------- VOICE · CALLBACK (outbound) · ENGLISH ----------------
  - id: voice.callback.en
    channel: voice
    direction: callback
    language: en
    script: >-
      Hi, is this {{CALLER_NAME}}? This is {{AGENT_NAME}} calling from {{FIRM_NAME}} —
      I'm the firm's AI assistant, not a person, and I'm not an attorney, so I can't give
      legal advice. You reached out to the firm and I'm following up to get you scheduled.
      {{RECORDING_NOTICE}} Is now an okay time?
    rules:
      - Confirm you are speaking to the right person BEFORE saying anything about a legal
        matter. Never state the practice area, the matter, or why they contacted the firm
        to an unconfirmed listener.
      - If someone other than {{CALLER_NAME}} answers, do not describe the matter, do not
        say what kind of firm this is beyond the firm name, and do not leave matter detail.
        Ask when {{CALLER_NAME}} can be reached, or leave the minimal voicemail below.
      - Never call outside {{OUTBOUND_CALL_WINDOW}} (default 8:00–20:00 local to the
        recipient). VERIFY: TCPA and state telemarketing calling-hour restrictions may
        apply to callback attempts; the founder's attorney must confirm the window and
        any consent/DNC obligations before outbound callback is enabled.
      - If the person's contact record is flagged safe_contact_only (see escalation.yaml,
        domestic_violence), follow that flag's contact restrictions instead of this script.
    voicemail:
      en: >-
        Hi, this is a message from {{FIRM_NAME}} for {{CALLER_NAME}}. We're following up
        on your inquiry. Please call us back at {{FIRM_MAIN_PHONE}}. Thank you.
      rules:
        - No matter detail, no practice area, no "about your accident/divorce/case".
        - Leave a voicemail only if the person consented to voicemail at intake, or this
          is the number they themselves provided as reachable.

  # ---------------- VOICE · CALLBACK · SPANISH ----------------
  - id: voice.callback.es
    channel: voice
    direction: callback
    language: es
    script: >-
      Hola, ¿hablo con {{CALLER_NAME}}? Le habla {{AGENT_NAME}}, de {{FIRM_NAME}}. Soy el
      asistente de inteligencia artificial de la oficina — no soy una persona ni soy
      abogado, así que no le puedo dar asesoría legal. Usted se comunicó con la oficina y
      lo llamo para agendarle una cita. {{RECORDING_NOTICE}} ¿Es buen momento?
    voicemail:
      es: >-
        Hola, este es un mensaje de {{FIRM_NAME}} para {{CALLER_NAME}}. Le llamamos para
        dar seguimiento a su consulta. Por favor comuníquese al {{FIRM_MAIN_PHONE}}.
        Gracias.
    rules_ref: voice.callback.en

  # ---------------- CHAT · INBOUND · ENGLISH ----------------
  - id: chat.inbound.en
    channel: chat
    direction: inbound
    language: en
    # Delivered as the first message, including when the widget auto-opens. Split into
    # two bubbles so the disclosure is not scrolled past.
    script:
      - >-
        Hi — I'm {{AGENT_NAME}}, the AI assistant for {{FIRM_NAME}}. Quick heads up
        before we start: I'm an AI, not a person, and I'm not an attorney, so I can't give
        legal advice.
      - >-
        What I can do is take down what's going on and get you scheduled with
        {{ATTORNEY_NAMES}}. What brings you here today?
    persistent_banner:
      # Rendered above the transcript for the life of the session. Belt and braces —
      # does not substitute for the scripted first message.
      en: "AI assistant · not an attorney · cannot give legal advice"
    notes: >
      The banner is required in addition to, never instead of, the first message. A
      caller who joins mid-session (page refresh, new tab) gets the first message again.

  # ---------------- CHAT · INBOUND · SPANISH ----------------
  - id: chat.inbound.es
    channel: chat
    direction: inbound
    language: es
    script:
      - >-
        Hola, soy {{AGENT_NAME}}, el asistente de inteligencia artificial de
        {{FIRM_NAME}}. Antes de empezar: soy IA, no una persona, y no soy abogado, así que
        no le puedo dar asesoría legal.
      - >-
        Lo que sí puedo hacer es tomar su información y agendarle una cita con
        {{ATTORNEY_NAMES}}. ¿En qué le puedo ayudar?
    persistent_banner:
      es: "Asistente de IA · no es abogado · no da asesoría legal"

  # ---------------- CHAT · CALLBACK (proactive / re-engagement) · ENGLISH ----------------
  - id: chat.callback.en
    channel: chat
    direction: callback
    language: en
    # Used for SMS follow-up and missed-call text-back. First outbound message MUST
    # disclose before asking anything.
    script:
      - >-
        Hi {{CALLER_NAME}} — this is {{AGENT_NAME}}, the AI assistant for {{FIRM_NAME}}
        (I'm an AI, not an attorney, and I can't give legal advice). We missed your call
        just now.
      - >-
        Want me to take a few details and get you on the calendar? Reply STOP to opt out.
    rules:
      - No matter detail in an outbound SMS. Ever. The recipient's phone may not be private.
      - Include an opt-out on the first outbound message. VERIFY: TCPA / 10DLC consent and
        opt-out requirements apply to missed-call text-back; confirm with counsel and with
        the messaging provider's campaign registration before enabling.
      - Honor STOP immediately and permanently; log data_request.

  # ---------------- CHAT · CALLBACK · SPANISH ----------------
  - id: chat.callback.es
    channel: chat
    direction: callback
    language: es
    script:
      - >-
        Hola {{CALLER_NAME}}, le escribe {{AGENT_NAME}}, asistente de inteligencia
        artificial de {{FIRM_NAME}} (soy IA, no soy abogado y no doy asesoría legal).
        No pudimos contestar su llamada.
      - >-
        ¿Le tomo unos datos y le agendo una cita? Responda STOP para no recibir más
        mensajes.
    rules_ref: chat.callback.en

# --------------------------------------------------------------------------------------
# "Are you a real person?" — must be answered directly, in any language, at any point.
# Not a variant: this is a mandatory response pattern.
# --------------------------------------------------------------------------------------
direct_question_response:
  triggers:
    en: ["are you a real person", "are you human", "am i talking to a robot", "is this a bot",
         "are you AI", "is this recorded", "is this a machine", "are you real"]
    es: ["es una persona real", "eres humano", "esto es un robot", "es una grabación",
         "es una máquina", "hablo con una persona"]
  response:
    en: >-
      No — I'm an AI assistant, not a person. I work for {{FIRM_NAME}}, and I'm not an
      attorney, so I can't give legal advice. I can take your information and get you in
      front of an attorney. Would you rather talk to someone on the team?
    es: >-
      No, soy un asistente de inteligencia artificial, no una persona. Trabajo para
      {{FIRM_NAME}} y no soy abogado, así que no le puedo dar asesoría legal. Sí puedo
      tomar su información y conectarlo con un abogado. ¿Prefiere hablar con alguien del
      equipo?
  prohibitions:
    - Never claim or imply you are human.
    - Never dodge, joke, or answer a different question.
    - Never say "I'm here to help you" in place of answering.
    - Never require the person to justify the question.

# --------------------------------------------------------------------------------------
# "I don't want to talk to an AI."
# --------------------------------------------------------------------------------------
opt_out_of_ai:
  response:
    en: >-
      Completely understandable. Let me get you to a person.
    es: >-
      Lo entiendo perfectamente. Le paso con una persona.
  behavior:
    - Do not argue, do not sell the AI, do not ask them to reconsider.
    - Follow the human-handoff path in system-prompt.md BLOCK 17, in order of preference.
    - Log: { event: human_handoff, reason: caller_declined_ai }
